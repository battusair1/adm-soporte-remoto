name: Configurar firma de advising-monitor

on:
  push:
    branches: [chore/firma-advising-monitor]
    paths: [.github/workflows/transfer-monitor-secrets.yml]

permissions:
  contents: read

jobs:
  cifrar-para-destino:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Preparar libsodium
        run: |
          python3 -m venv "$RUNNER_TEMP/secret-transfer-env"
          "$RUNNER_TEMP/secret-transfer-env/bin/pip" install --disable-pip-version-check PyNaCl==1.6.2

      - name: Cifrar los cuatro secretos con la clave publica de advising-monitor
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          DESTINATION_KEY: Zzryl3uuy61bpBzlkA0oXhAC/V2WG2f2puRKgyRe9BA=
          DESTINATION_KEY_ID: '3380204578043523366'
        run: |
          "$RUNNER_TEMP/secret-transfer-env/bin/python" - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl import encoding, public

          names = ('ES_USERNAME', 'ES_PASSWORD', 'CREDENTIAL_ID', 'ES_TOTP_SECRET')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Falta al menos uno de los cuatro secretos de origen.')
          key = public.PublicKey(os.environ['DESTINATION_KEY'], encoding.Base64Encoder())
          box = public.SealedBox(key)
          output = Path('transfer-sealed')
          output.mkdir(mode=0o700)
          for name in names:
              ciphertext = box.encrypt(os.environ[name].encode('utf-8'))
              payload = {'encrypted_value': base64.b64encode(ciphertext).decode('ascii'),
                         'key_id': os.environ['DESTINATION_KEY_ID']}
              (output / (name + '.json')).write_text(json.dumps(payload), encoding='utf-8')
          print('Cuatro valores cifrados exclusivamente para battusair1/advising-monitor.')
          PY

      - name: Guardar solo los valores cifrados
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esigner-cifrado-para-advising-monitor
          path: transfer-sealed/*.json
          retention-days: 1
          if-no-files-found: error
